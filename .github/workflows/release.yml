name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Validate release scaffold
        run: ./scripts/release-dry-run.sh "${VERSION}"
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
